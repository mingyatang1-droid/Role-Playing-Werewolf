services:
  postgres:
    image: postgres:17-alpine
    container_name: role-playing-werewolf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: werewolf
      POSTGRES_USER: werewolf
      POSTGRES_PASSWORD: werewolf_dev
    ports:
      - "5432:5432"
    volumes:
      - werewolf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U werewolf -d werewolf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  werewolf_postgres_data:
